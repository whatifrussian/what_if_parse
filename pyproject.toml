[project]
name = "what-if-parse"
version = "2.0.0"
description = "Download what-if.xkcd.com articles and convert them to Markdown"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lxml>=5.3.2,<7",
    "requests>=2.32.4,<3",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W"]
